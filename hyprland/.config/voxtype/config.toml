# Voxtype Configuration
#
# Location: ~/.config/voxtype/config.toml
# All settings can be overridden via CLI flags
#
# State file for external integrations (Waybar, polybar, etc.)
# Use "auto" for default location ($XDG_RUNTIME_DIR/voxtype/state),
# a custom path, or "disabled" to turn off. The daemon writes state
# ("idle", "recording", "transcribing") to this file whenever it changes.
# Required for `voxtype record toggle` and `voxtype status` commands.
state_file = "auto"

[hotkey]
# Hotkey is configured in Hyprland. Default is Super + Ctrl + X
enabled = false

[audio]
# Pause MPRIS media players during recording
pause_media = true

# Audio input device ("default" uses system default)
# List devices with: pactl list sources short
device = "default"
# device = "alsa_input.usb-046d_HD_Pro_Webcam_C920_3B780E5F-02.analog-stereo"

# Sample rate in Hz (whisper expects 16000)
sample_rate = 16000

# Maximum recording duration in seconds (safety limit)
max_duration_secs = 60

# [audio.feedback]
# Enable audio feedback sounds (beeps when recording starts/stops)
# enabled = true
#
# Sound theme: "default", "subtle", "mechanical", or path to custom theme directory
# theme = "default"
#
# Volume level (0.0 to 1.0)
# volume = 0.7

[whisper]
# Transcription happens on powerant's whisper.cpp server (GPU, Vulkan) via Tailscale.
# See ~/personal/homelab/powerant/whisper/ for the server side.
# If powerant is off, voxtype has no fallback — dictation just fails.
mode = "remote"
remote_endpoint = "http://powerant:8080"
remote_timeout_secs = 60

# Model name sent to the remote server. whisper.cpp server ignores this
# (it uses whatever model it was started with), so keep the default.
# remote_model = "whisper-1"

# Language for transcription
# Use "en" for English, "auto" for auto-detection
language = "auto"

# Translate non-English speech to English
translate = false

[output]
# Primary output mode: "type", "clipboard" or "paste"
# - type: Simulates keyboard input at cursor position (via wtype)
# - clipboard: Copies text to clipboard (requires wl-copy)
# - paste: Copies to clipboard and sends the paste keystroke
#
# En "type" voxtype teclea con wtype, que sube un keymap sintético al
# compositor. Electron (Slack) no lo respeta y se come los acentuados: la "ó"
# desaparecía a mitad de frase mientras en la terminal salía bien. Es un bug
# de Electron en Wayland con layouts de teclas muertas — el nuestro es
# "English (intl., with AltGr dead keys)" — cerrado como "not planned":
# https://github.com/electron/electron/issues/46823
# "paste" se salta el keymap entero, pero obliga a inyectar una pulsación de
# pegar, y eso trajo sus propios problemas (ver paste_keys más abajo).
# Volvemos a "type" apoyándonos en dotool, que no usa el teclado virtual de
# Wayland: escribe por /dev/uinput con keycodes evdev reales, así que Electron
# lo ve como un teclado físico y aplica el layout de verdad.
# Copia de la versión "paste" que funcionaba, por si hay que volver:
#   ~/.local/state/voxtype-config-backups/config.toml.PASTE-shift-insert
mode = "type"

# Fall back to clipboard if typing fails
fallback_to_clipboard = true

# Orden de drivers para mode = "type".
# dotool primero: es el único que no pasa por el keymap sintético de wtype, que
# es lo que rompe los acentuados en Slack. Requiere pertenecer al grupo "input"
# (regla udev /usr/lib/udev/rules.d/80-dotool.rules deja /dev/uinput en
# root:input 0620) y volver a iniciar sesión para que el servicio de usuario
# herede el grupo. wtype se queda detrás como red de seguridad: si dotool no
# puede abrir uinput en otra máquina, el dictado sigue escribiendo aunque los
# acentos salgan mal.
driver_order = ["dotool", "wtype", "clipboard"]

# dotool no lee el layout activo del compositor: hay que decírselo. Estos dos
# tienen que seguir a input.conf (kb_layout = us,es / variant altgr-intl).
# Si algún día dictas con el layout "es" seleccionado, esto se quedará corto.
dotool_xkb_layout = "us"
dotool_xkb_variant = "altgr-intl"

# Delay between typed characters in milliseconds
# 0 = fastest possible, increase if characters are dropped
type_delay_ms = 1

# Combinación que voxtype manda para pegar. INERTE mientras mode = "type";
# se conserva porque costó encontrarla y es a lo que volvemos si dotool falla.
# SHIFT+Insert y no SUPER+V: el "Universal paste" de Omarchy
# (default/hypr/bindings/clipboard.lua:46) es un binding del compositor, y
# meterle un SUPER inyectado con wtype mientras el PTT (SUPER+SPACE) tiene el
# SUPER físico apretado dispara otros atajos — el menú de apagado, en la
# prueba del 2026-08-27. Es el riesgo que el propio comentario de Omarchy
# describe: "the physically held SUPER merges into the injected chord at the
# seat". SHIFT+Insert no pasa por Hyprland (Insert no tiene ningún binding) y
# pega igual en las dos partes: Alacritty, foot y ghostty lo traen como
# clipboard-paste, y en Chromium/Electron es atajo de pegar nativo.
paste_keys = "shift+insert"

# Guarda el portapapeles antes de transcribir y lo devuelve tras pegar.
# Por defecto voxtype lo deja sobrescrito; con esto el dictado deja de
# pisar lo que tuvieras copiado. El retardo da tiempo a que la app lea el
# portapapeles antes de restaurarlo.
restore_clipboard = true
restore_clipboard_delay_ms = 200

# El PTT es SUPER+SPACE: sin esto lo que se teclea se mezcla con el SUPER que
# todavía tienes apretado y salen chords en vez de texto. El precio es que si
# no sueltas SUPER no aparece nada — es espera, no un fallo.
wait_for_modifier_release = true

# Post-processing command (optional)
# Pipe transcribed text through an external command for cleanup before output.
# The command receives text on stdin and outputs processed text on stdout.
# Useful for LLM-based text cleanup, grammar correction, filler word removal.
# On any failure (timeout, error), falls back to original transcription.
#
# whisper.cpp returns each segment on its own line, and voxtype would type those
# newlines literally — which sends the message in a chat box and runs the line in
# a terminal. This collapses them. Resolved via PATH (~/.local/bin is stowed), so
# no absolute path tied to one machine or one username.
[output.post_process]
command = "voxtype-clean-transcript"
timeout_ms = 1000

[output.notification]
# Show notification when recording starts (hotkey pressed)
on_recording_start = false

# Show notification when recording stops (transcription beginning)
on_recording_stop = false

# Show notification with transcribed text after transcription completes
on_transcription = false

# [text]
# Text processing options (word replacements, spoken punctuation)
#
# Enable spoken punctuation conversion (e.g., say "period" to get ".")
# spoken_punctuation = false
#
# Custom word replacements (case-insensitive)
# replacements = { "hyperwhisper" = "hyprwhspr" }

[meeting]
# Modo reunión: grabación larga troceada en chunks, transcrita una a una y
# cosida en un transcript continuo con timestamps. Nada que ver con el dictado:
# el dictado tiene max_duration_secs = 60, esto llega a max_duration_mins = 180.
# Se arranca y se para con F8 (voxtype-meeting-toggle). No hay activación por
# voz: no existe ninguna frase gatillo en el binario, es start/stop explícito.
#
# Viene desactivado de fábrica; sin esto `meeting start` no hace nada.
enabled = true

# Los chunks se transcriben con el mismo motor que el dictado, o sea contra
# whisper.cpp en powerant. Una reunión de una hora son ~120 peticiones por
# Tailscale, y si powerant está apagado la reunión se queda sin transcribir.
# chunk_duration_secs = 30

# Los segmentos se persisten en ~/.local/share/voxtype/meetings/ según se
# transcriben, así que un crash a mitad no se lleva la reunión por delante.
# El audio en crudo NO se guarda (retain_audio = false por defecto).

[meeting.audio]
# Con loopback_device = "auto" (el valor por defecto) voxtype busca el monitor
# de PipeWire y captura micro + audio del sistema a la vez: tu voz y la del
# otro lado de la llamada. Si no encuentra monitor cae a micro solo y lo dice
# en el log ("No monitor source found, using mic only").
loopback_device = "auto"

# Cancelación de eco GTCRN, para que tu propia voz saliendo por los altavoces
# no se transcriba dos veces. Con auriculares casi no hace falta; "auto" ya
# decide.
echo_cancel = "auto"

[meeting.diarization]
# backend = "simple" atribuye por fuente de audio: lo que entra por el micro es
# "You", lo que entra por el loopback es "Remote". Es exacto para 1:1 y para
# llamadas de grupo agrupa a todos los demás en un solo hablante. El backend
# "ml" (embeddings ECAPA-TDNN) sí los separa, pero necesita el modelo y la
# feature ml-diarization, que este build binario puede no traer.
backend = "simple"

[meeting.summary]
# Pendiente: `voxtype meeting summarize` saca key points, decisiones y action
# items, pero quiere un Ollama local en localhost:11434 que ahora mismo no hay.
# Para activarlo: backend = "ollama" y ollama_model = "<modelo>".
backend = "disabled"
