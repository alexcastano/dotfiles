# Point every process the systemd user manager starts at the agent from
# ssh-agent.service. bash/.bashrc and shell/.zshrc already export this, but
# only for interactive shells: GUI-launched programs (herdr's background
# server, for one) were born without it and could not use the passphrase
# protected key.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
